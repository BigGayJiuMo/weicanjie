# ============================================================
# 后端生产配置(application-docker.yml)
# 部署时由 docker compose 以环境变量注入,Spring 优先读取:
#   DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST / REDIS_PORT
#   MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY
# 启动命令:java -jar app.jar --spring.profiles.active=docker
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: weicanjie

# 其余(MyBatis-Plus、日志、Knife4j)沿用 application.yml